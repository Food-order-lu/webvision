<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  
  <!-- WebVision Main Text -->
  <text x="100" y="32" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="28" 
        font-weight="800" 
        fill="url(#textGradient)" 
        text-anchor="middle"
        letter-spacing="-0.02em">WebVision</text>
  
  <!-- Digital Studio Subtitle -->
  <text x="100" y="48" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8" 
        font-weight="500" 
        fill="#707090" 
        text-anchor="middle"
        letter-spacing="0.2em"
        text-transform="uppercase">DIGITAL STUDIO</text>
  
  <!-- by Rivego -->
  <text x="100" y="62" 
        font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8" 
        font-weight="600" 
        fill="#2563eb" 
        text-anchor="middle"
        font-style="italic">by Rivego</text>
</svg>
